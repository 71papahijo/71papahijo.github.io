<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #dfefff;
      --bg-accent: #cfe4ff;
      --surface: rgba(255, 255, 255, 0.72);
      --text: #132033;
      --muted: #4d6480;
      --border: rgba(120, 160, 210, 0.35);
      --shadow: 0 12px 30px rgba(60, 100, 160, 0.12);
      --radius: 16px;
      --max-width: 1200px;
    }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.65), transparent 35%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
      background-attachment: fixed;
    }

    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .navbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
    }

    .logo {
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.25rem;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .section {
      padding: 4rem 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .section-header h1,
    .section-header h2 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .section-header p {
      margin: 0 auto;
      max-width: 700px;
      color: var(--muted);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      align-items: start;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
    }

    .project-canvas {
      aspect-ratio: 1 / 1;
      width: 100%;
      background: #fff;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .project-canvas iframe,
    .project-canvas img,
    .project-canvas video,
    .project-canvas .canvas-placeholder {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: cover;
    }

    .canvas-placeholder {
      display: grid !important;
      place-items: center;
      padding: 1rem;
      text-align: center;
      color: var(--muted);
      background: linear-gradient(135deg, #f8f9fc, #eef2f8);
      font-weight: 600;
    }

    .project-info {
      padding: 1.1rem;
    }

    .project-info h3 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }

    .project-info p {
      margin: 0 0 1rem;
      color: var(--muted);
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tag {
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: #eef2ff;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .project-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.72rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid var(--border);
      color: var(--text);
      background: #fff;
    }

    .btn:hover {
      background: #f3f4f6;
    }

    .btn-primary {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .btn-primary:hover {
      background: #000;
    }

    footer {
      padding: 2rem 0 3rem;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .navbar .container {
        flex-direction: column;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-bg">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
  </div>
  
  <nav class="navbar">
    <div class="container">
      <a href="#" class="logo">71papahijo</a>
      <ul class="nav-links">
        <li><a href="#projects">Projects</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="section" id="projects">
      <div class="container">
        <div class="section-header">
          <h1>Projects</h1>
          <p>
            Each project is rendered from a single data object, so adding a new one is just
            adding another entry to the <code>projects</code> array.
          </p>
        </div>

        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">© 2025 71papahijo</div>
  </footer>

  <script>
    const projects = [
      {
        title: "Interactive Clock",
        description: "A Desmos-powered clock with moving hands and manual time controls.",
        preview: {
          type: "iframe",
          src: "./projects/DesmosClock.html"
        },
        tags: ["Desmos", "Math", "Interactive"],
        links: [
          { label: "Open Project", href: "./projects/DesmosClock.html", primary: true },
          { label: "Source", href: "https://github.com/your-username/your-repo" }
        ]
      },
      {
        title: "Next Project",
        description: "Drop in your next project here by copying this object and changing the fields.",
        preview: {
          type: "placeholder",
          text: "Your next project preview"
        },
        tags: ["Template"],
        links: [
          { label: "Coming Soon", href: "#" }
        ]
      }
    ];

    function createPreview(preview, title) {
      if (!preview) {
        return `<div class="canvas-placeholder">No preview for ${title}</div>`;
      }

      switch (preview.type) {
        case "iframe":
          return `
            <iframe
              src="${preview.src}"
              title="${title} preview"
              loading="lazy"
              allowfullscreen
            ></iframe>
          `;

        case "image":
          return `<img src="${preview.src}" alt="${title} preview">`;

        case "video":
          return `
            <video controls muted playsinline>
              <source src="${preview.src}" type="video/mp4">
              Your browser does not support video.
            </video>
          `;

        case "placeholder":
        default:
          return `<div class="canvas-placeholder">${preview.text || `Preview for ${title}`}</div>`;
      }
    }

    function createTags(tags = []) {
      if (!tags.length) return "";
      return `
        <div class="project-tags">
          ${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
        </div>
      `;
    }

    function createLinks(links = []) {
      if (!links.length) return "";
      return `
        <div class="project-actions">
          ${links.map(link => `
            <a
              class="btn ${link.primary ? "btn-primary" : ""}"
              href="${link.href}"
              ${link.href.startsWith("http") ? 'target="_blank" rel="noopener noreferrer"' : ""}
            >
              ${link.label}
            </a>
          `).join("")}
        </div>
      `;
    }

    function createProjectCard(project) {
      return `
        <article class="project-card">
          <div class="project-canvas">
            ${createPreview(project.preview, project.title)}
          </div>
          <div class="project-info">
            <h3>${project.title}</h3>
            <p>${project.description}</p>
            ${createTags(project.tags)}
            ${createLinks(project.links)}
          </div>
        </article>
      `;
    }

    function renderProjects() {
      const grid = document.getElementById("projectsGrid");
      grid.innerHTML = projects.map(createProjectCard).join("");
    }

    renderProjects();
  </script>
</body>
</html>
